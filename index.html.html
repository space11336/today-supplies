<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 준비물</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
    "Noto Sans KR", sans-serif;
  background: #f5f7fb;
  color: #202735;
}

button,
input {
  font-family: inherit;
}

.container {
  width: min(1000px, 92%);
  margin: 0 auto;
  padding: 35px 0 60px;
}

/* 상단 */
header {
  background: linear-gradient(135deg, #5b7cfa, #7657e8);
  color: white;
  border-radius: 24px;
  padding: 32px;
  margin-bottom: 20px;
  box-shadow: 0 12px 30px rgba(91,124,250,.25);
}

header .date {
  font-size: 15px;
  opacity: .85;
  margin-bottom: 8px;
}

header h1 {
  margin: 0;
  font-size: clamp(28px, 6vw, 42px);
}

header p {
  margin: 12px 0 0;
  opacity: .9;
}

/* 다음 수업 */
.next-class {
  background: white;
  border-radius: 18px;
  padding: 18px 22px;
  margin-bottom: 20px;
  box-shadow: 0 5px 20px rgba(30,40,70,.07);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

.next-class-title {
  font-size: 13px;
  color: #8b93a3;
  margin-bottom: 4px;
}

.next-class-name {
  font-size: 20px;
  font-weight: 800;
}

.next-class-time {
  text-align: right;
  font-size: 14px;
  color: #5b7cfa;
  font-weight: 700;
}

/* 버튼 */
.button-row {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 20px;
}

.date-button,
.view-button {
  border: none;
  background: white;
  color: #4c5a78;
  padding: 11px 17px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 5px 15px rgba(30,40,70,.08);
  transition: .2s;
}

.date-button:hover,
.view-button:hover {
  background: #eef2ff;
  transform: translateY(-2px);
}

.today-button,
.active-view {
  background: #5b7cfa;
  color: white;
}

.today-button:hover,
.active-view:hover {
  background: #4b6bea;
}

/* 안내 */
.notice {
  background: #fff8df;
  border: 1px solid #f5df91;
  color: #725d16;
  border-radius: 16px;
  padding: 15px 17px;
  margin-bottom: 20px;
  line-height: 1.6;
  font-size: 14px;
}

/* 카드 */
.card {
  background: white;
  border-radius: 20px;
  padding: 24px;
  margin-bottom: 20px;
  box-shadow: 0 5px 20px rgba(30,40,70,.07);
}

.card-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
  gap: 10px;
}

.card-title h2 {
  margin: 0;
  font-size: 22px;
}

.edit-button {
  border: none;
  background: #eef2ff;
  color: #4d62c7;
  padding: 8px 13px;
  border-radius: 10px;
  font-weight: 700;
  cursor: pointer;
}

/* 시간표 */
.schedule {
  display: grid;
  gap: 10px;
}

.period {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 15px;
  border-radius: 15px;
  background: #f7f8fc;
  border: 2px solid transparent;
  transition: .2s;
}

.period:hover {
  transform: translateY(-2px);
  background: #f0f3ff;
}

/* 현재 교시 */
.period.current {
  border-color: #5b7cfa;
  background: #eef2ff;
  box-shadow: 0 5px 15px rgba(91,124,250,.15);
}

.period.finished {
  opacity: .55;
}

.period-number {
  width: 42px;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 12px;
  background: #5b7cfa;
  color: white;
  font-weight: bold;
  flex-shrink: 0;
}

.period-info {
  flex: 1;
}

.subject {
  font-size: 17px;
  font-weight: 800;
}

.period-time {
  margin-top: 4px;
  font-size: 12px;
  color: #8b93a3;
}

.current-label {
  font-size: 12px;
  font-weight: 800;
  color: #5b7cfa;
  white-space: nowrap;
}

/* 과목 색상 */
.subject-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  display: inline-block;
  margin-right: 6px;
  background: #5b7cfa;
}

.dot-math {
  background: #5b7cfa;
}

.dot-science {
  background: #40b883;
}

.dot-english {
  background: #9b6cff;
}

.dot-korean {
  background: #ef6b73;
}

.dot-sports {
  background: #f39c4a;
}

.dot-other {
  background: #7f8c8d;
}

/* 준비물 */
.supplies {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 14px;
}

.supply-item {
  border: 1px solid #e8ebf2;
  border-radius: 16px;
  padding: 16px;
  background: white;
  transition: .2s;
}

.supply-item.checked {
  background: #f4f5f7;
  opacity: .65;
}

.supply-item.checked .supply-name {
  text-decoration: line-through;
}

.supply-check {
  display: flex;
  align-items: flex-start;
  gap: 11px;
  cursor: pointer;
}

.supply-check input {
  width: 20px;
  height: 20px;
  margin-top: 2px;
  cursor: pointer;
  accent-color: #5b7cfa;
}

.supply-name {
  font-size: 16px;
  font-weight: 800;
}

.supply-subjects {
  margin-top: 5px;
  font-size: 12px;
  color: #8b93a3;
}

.none {
  color: #8b93a3;
  font-size: 14px;
}

/* 주간 시간표 */
.weekly-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
  overflow-x: auto;
}

.week-day {
  min-width: 145px;
  background: #f7f8fc;
  border-radius: 15px;
  padding: 12px;
}

.week-day.today {
  background: #eef2ff;
  border: 2px solid #5b7cfa;
}

.week-day-title {
  font-weight: 800;
  margin-bottom: 10px;
  text-align: center;
}

.week-subject {
  background: white;
  border-radius: 10px;
  padding: 10px;
  margin-bottom: 7px;
  font-size: 13px;
  font-weight: 700;
}

/* 편집 */
.editor {
  display: none;
  background: #f7f8fc;
  border-radius: 16px;
  padding: 18px;
  margin-top: 15px;
}

.editor.show {
  display: block;
}

.editor h3 {
  margin: 0 0 15px;
}

.editor-row {
  display: grid;
  grid-template-columns: 70px 1fr;
  gap: 10px;
  align-items: center;
  margin-bottom: 8px;
}

.editor-row label {
  font-size: 13px;
  font-weight: 700;
}

.editor-row input {
  width: 100%;
  border: 1px solid #dfe3ec;
  border-radius: 9px;
  padding: 9px;
  background: white;
}

.save-button {
  width: 100%;
  border: none;
  background: #5b7cfa;
  color: white;
  padding: 11px;
  border-radius: 10px;
  font-weight: 800;
  cursor: pointer;
  margin-top: 10px;
}

footer {
  text-align: center;
  color: #8a92a2;
  font-size: 13px;
  margin-top: 30px;
}


/* 관리자 */
.admin-status{font-size:12px;color:#5b7cfa;font-weight:700;margin-top:8px}
.admin-button{border:none;background:#eef2ff;color:#4d62c7;padding:8px 13px;border-radius:10px;font-weight:700;cursor:pointer}
.admin-button:hover{background:#dfe6ff}
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(20,25,40,.45);z-index:9999;align-items:center;justify-content:center;padding:20px}
.modal-backdrop.show{display:flex}
.admin-modal{width:min(420px,100%);background:white;border-radius:20px;padding:24px;box-shadow:0 20px 60px rgba(20,25,40,.25)}
.admin-modal h3{margin:0 0 8px}.admin-modal p{margin:0 0 16px;color:#737b8c;font-size:14px}
.admin-modal input{width:100%;border:1px solid #dfe3ec;border-radius:10px;padding:12px;font-size:16px;outline:none}
.admin-modal input:focus{border-color:#5b7cfa}
.admin-modal-buttons{display:flex;gap:8px;margin-top:12px}
.admin-modal-buttons button{flex:1;border:none;padding:11px;border-radius:10px;font-weight:800;cursor:pointer}
.login-confirm{background:#5b7cfa;color:white}.login-cancel{background:#eef1f6;color:#4c5a78}

/* 모바일 */
@media (max-width: 600px) {
  .container {
    padding-top: 20px;
  }

  header {
    padding: 25px;
    border-radius: 20px;
  }

  .card {
    padding: 19px;
  }

  .next-class {
    align-items: flex-start;
  }

  .next-class-time {
    font-size: 12px;
  }

  .period {
    padding: 12px;
  }

  .period-number {
    width: 38px;
    height: 38px;
  }

  .current-label {
    font-size: 10px;
  }

  .date-button,
  .view-button {
    padding: 9px 12px;
    font-size: 12px;
  }

  .weekly-grid {
    grid-template-columns: repeat(5, 145px);
  }
}
</style>
</head>

<body>

<div class="container">

<header>
  <div class="date" id="today"></div>
  <h1>🎒 오늘의 준비물</h1>
  <p id="description">오늘 시간표에 맞춰 준비물을 확인해 보세요!</p>
</header>

<!-- 다음 수업 -->
<div class="next-class">
  <div>
    <div class="next-class-title">다음 수업</div>
    <div class="next-class-name" id="nextClass">
      시간표 확인 중...
    </div>
  </div>

  <div class="next-class-time" id="nextClassTime"></div>
</div>

<!-- 날짜 이동 -->
<div class="button-row">
  <button class="date-button" id="previousButton">
    ← 전날
  </button>

  <button class="date-button today-button" id="todayButton">
    오늘
  </button>

  <button class="date-button" id="nextButton">
    다음날 →
  </button>
</div>

<!-- 화면 전환 -->
<div class="button-row">
  <button class="view-button active-view" id="dayViewButton">
    📅 하루 보기
  </button>

  <button class="view-button" id="weekViewButton">
    📊 주간 보기
  </button>
</div>

<div class="notice">
  💡 <strong>Tip!</strong>
  준비물을 클릭하면 챙긴 것으로 표시됩니다.
  체크 상태는 자동으로 저장됩니다.
</div>


<div class="card" style="padding:16px 20px;">
  <div class="card-title" style="margin-bottom:0;">
    <div>
      <strong>🔐 관리자</strong>
      <div class="admin-status" id="adminStatus">일반 사용자 모드</div>
    </div>
    <button class="admin-button" id="adminButton">관리자 로그인</button>
  </div>
</div>

<div class="modal-backdrop" id="adminModal">
  <div class="admin-modal">
    <h3>🔐 관리자 로그인</h3>
    <p>관리자 계정으로 로그인해야 시간표를 수정할 수 있습니다.</p>
    <input id="adminEmailInput" type="email" placeholder="관리자 이메일" autocomplete="username" style="margin-bottom:8px;">
    <input id="adminPasswordInput" type="password" placeholder="관리자 비밀번호" autocomplete="current-password">
    <div class="admin-modal-buttons">
      <button class="login-cancel" id="adminCancelButton">취소</button>
      <button class="login-confirm" id="adminLoginButton">로그인</button>
    </div>
  </div>
</div>

<!-- 하루 보기 -->
<div id="dayView">

  <section class="card">

    <div class="card-title">
      <h2 id="scheduleTitle">📅 오늘의 시간표</h2>

      <button class="edit-button" id="editButton">
        ✏️ 시간표 수정
      </button>
    </div>

    <div class="schedule" id="schedule"></div>

    <!-- 편집 -->
    <div class="editor" id="editor">

      <h3>✏️ 선택한 요일 시간표 수정</h3>

      <div id="editorInputs"></div>

      <button class="save-button" id="saveScheduleButton">
        💾 시간표 저장
      </button>

    </div>

  </section>

  <!-- 준비물 -->
  <section class="card">

    <div class="card-title">
      <h2 id="suppliesTitle">🎒 오늘 챙길 준비물</h2>
    </div>

    <div class="supplies" id="supplies"></div>

  </section>

</div>

<!-- 주간 보기 -->
<div id="weekView" style="display:none;">

  <section class="card">

    <div class="card-title">
      <h2>📊 이번 주 시간표</h2>
    </div>

    <div class="weekly-grid" id="weeklyGrid"></div>

  </section>

</div>

<footer>
  우리 반 시간표 · 준비물 알림
</footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>


/* ==================================================
   온라인 시간표 저장소 (Supabase)
   아래 두 값을 Supabase 프로젝트에서 복사해 입력하세요.
================================================== */

const SUPABASE_URL = "여기에_Supabase_URL_입력";
const SUPABASE_PUBLISHABLE_KEY = "여기에_Supabase_Publishable_Key_입력";

const supabaseClient =
  (SUPABASE_URL.includes("여기에_") || SUPABASE_PUBLISHABLE_KEY.includes("여기에_"))
    ? null
    : window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );

const ONLINE_DATA_ID = "main";

/* ==================================================
   요일별 시간표
================================================== */

let schedule =
  JSON.parse(localStorage.getItem("mySchedule")) || {

  1: [
    "융합 과학 탐구",
    "역학과 에너지",
    "화법과 작문",
    "물질과 에너지",
    "영어와 독해",
    "세포와 물질대사"
  ],

  2: [
    "지과/기하",
    "미적분",
    "영어와 독해",
    "융합 과학 탐구",
    "화법과 작문",
    "역학과 에너지",
    "물질과 에너지"
  ],

  3: [
    "화법과 작문",
    "스포츠 생활2",
    "지과/기하",
    "영어와 독해",
    "미적분",
    "역학과 에너지"
  ],

  4: [
    "영어와 독해",
    "융합 과학 탐구",
    "세포와 물질대사",
    "미적분",
    "물질과 에너지",
    "화법과 작문",
    "창체"
  ],

  5: [
    "세포와 물질대사",
    "지과/기하",
    "스포츠 생활2",
    "미적분",
    "동아리",
    "동아리"
  ]
};



/* ==================================================
   온라인 시간표 불러오기 / 저장하기
================================================== */

async function loadOnlineSchedule() {
  if (!supabaseClient) {
    console.warn("Supabase 설정이 아직 입력되지 않았습니다.");
    updatePage();
    return;
  }

  const { data, error } = await supabaseClient
    .from("timetable")
    .select("schedule")
    .eq("id", ONLINE_DATA_ID)
    .maybeSingle();

  if (error) {
    console.error(error);
    alert("온라인 시간표를 불러오지 못했습니다. Supabase 설정과 RLS 정책을 확인하세요.");
    updatePage();
    return;
  }

  if (data && data.schedule) {
    schedule = data.schedule;
    localStorage.setItem("mySchedule", JSON.stringify(schedule));
  }

  updatePage();
}

async function saveOnlineSchedule() {
  if (!supabaseClient) {
    alert("Supabase URL과 Publishable Key를 먼저 입력하세요.");
    return false;
  }

  const { error } = await supabaseClient
    .from("timetable")
    .upsert(
      {
        id: ONLINE_DATA_ID,
        schedule: schedule,
        updated_at: new Date().toISOString()
      },
      { onConflict: "id" }
    );

  if (error) {
    console.error(error);
    alert("온라인 저장에 실패했습니다.\n" + error.message);
    return false;
  }

  localStorage.setItem("mySchedule", JSON.stringify(schedule));
  return true;
}

async function loginAdminOnline() {
  if (!supabaseClient) {
    alert("Supabase 설정을 먼저 입력하세요.");
    return;
  }

  const email = document.getElementById("adminEmailInput").value.trim();
  const password = document.getElementById("adminPasswordInput").value;

  if (!email || !password) {
    alert("관리자 이메일과 비밀번호를 입력하세요.");
    return;
  }

  const { error } = await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    alert("관리자 로그인에 실패했습니다.\n" + error.message);
    return;
  }

  isAdmin = true;
  closeAdminModal();
  updateAdminUI();
  alert("관리자 로그인 완료!");
}

async function logoutAdminOnline() {
  if (supabaseClient) {
    await supabaseClient.auth.signOut();
  }
  isAdmin = false;
  updateAdminUI();
}

/* ==================================================
   과목별 준비물
================================================== */

let supplies =
  JSON.parse(localStorage.getItem("mySupplies")) || {

  "화법과 작문": [
    "화법과 작문 교과서",
    "필통"
  ],

  "지과/기하": [
    "지구 시스템 과학 교과서 / 기하 교과서",
    "필통"
  ],

  "역학과 에너지": [
    "역학과 에너지 교과서",
    "노트",
    "필통"
  ],

  "물질과 에너지": [
    "물질과 에너지 교과서",
    "필통"
  ],

  "미적분": [
    "미적분 교과서",
    "필통"
  ],

  "세포와 물질대사": [
    "세포와 물질대사 교과서",
    "필통"
  ],

  "융합 과학 탐구": [
    "융합 과학 탐구 교과서",
    "필통"
  ],

  "영어와 독해": [
    "영어와 독해 교과서",
    "필통"
  ],

  "스포츠 생활2": [
    "체육복",
    "운동화"
  ],

  "동아리": [
    "스마트 기기"
  ],

  "창체": []
};


/* ==================================================
   요일
================================================== */

const dayNames = [
  "일요일",
  "월요일",
  "화요일",
  "수요일",
  "목요일",
  "금요일",
  "토요일"
];


/* ==================================================
   ★ 교시 실제 시간
   여기만 실제 학교 시간으로 수정하면 됨.
================================================== */

const periodTimes = [

  ["09:00", "09:50"],   // 1교시
  ["10:00", "10:50"],   // 2교시
  ["11:00", "11:50"],   // 3교시
  ["12:00", "12:50"],   // 4교시
  ["13:40", "14:30"],   // 5교시
  ["14:40", "15:30"],   // 6교시
  ["15:40", "16:30"]    // 7교시

];


/* ==================================================
   날짜
================================================== */

const realToday = new Date();

let selectedDate = new Date(realToday);


/* ==================================================
   준비물 체크 상태
================================================== */

let checkedSupplies =
  JSON.parse(localStorage.getItem("checkedSupplies")) || {};


/* ==================================================
   과목 색상
================================================== */

function getSubjectDot(subject) {

  if (
    subject.includes("미적분") ||
    subject.includes("기하")
  ) {
    return "dot-math";
  }

  if (
    subject.includes("과학") ||
    subject.includes("역학") ||
    subject.includes("물질") ||
    subject.includes("세포")
  ) {
    return "dot-science";
  }

  if (subject.includes("영어")) {
    return "dot-english";
  }

  if (
    subject.includes("화법") ||
    subject.includes("작문")
  ) {
    return "dot-korean";
  }

  if (
    subject.includes("스포츠") ||
    subject.includes("체육")
  ) {
    return "dot-sports";
  }

  return "dot-other";
}


/* ==================================================
   날짜 키
================================================== */

function getDateKey(date) {

  return [
    date.getFullYear(),
    String(date.getMonth() + 1).padStart(2, "0"),
    String(date.getDate()).padStart(2, "0")
  ].join("-");

}


/* ==================================================
   오늘인지 확인
================================================== */

function isToday(date) {

  return getDateKey(date) === getDateKey(new Date());

}


/* ==================================================
   시간 → 분 변환
================================================== */

function timeToMinutes(time) {

  if (!time || !time.includes(":")) {
    return null;
  }

  const [hour, minute] =
    time.split(":").map(Number);

  if (
    Number.isNaN(hour) ||
    Number.isNaN(minute)
  ) {
    return null;
  }

  return hour * 60 + minute;

}


/* ==================================================
   날짜 표시

/* ==================================================
   ★ 현재 교시 계산
================================================== */

function getCurrentPeriod() {

  if (!isToday(selectedDate)) {
    return -1;
  }

  const now = new Date();

  const currentMinutes =
    now.getHours() * 60 +
    now.getMinutes();


  for (let i = 0; i < periodTimes.length; i++) {

    const startMinutes =
      timeToMinutes(periodTimes[i][0]);

    const endMinutes =
      timeToMinutes(periodTimes[i][1]);


    if (
      startMinutes !== null &&
      endMinutes !== null &&
      currentMinutes >= startMinutes &&
      currentMinutes < endMinutes
    ) {
      return i;
    }

  }

  return -1;

}


/* ==================================================
   ★ 다음 수업 계산
================================================== */

function getNextClassIndex() {

  if (!isToday(selectedDate)) {
    return -1;
  }

  const todaySchedule =
    schedule[selectedDate.getDay()] || [];

  const now = new Date();

  const currentMinutes =
    now.getHours() * 60 +
    now.getMinutes();


  /*
    현재 수업 중이면
    현재 교시 다음 수업을 찾음
  */

  const currentPeriod =
    getCurrentPeriod();


  if (currentPeriod >= 0) {

    for (
      let i = currentPeriod + 1;
      i < todaySchedule.length;
      i++
    ) {

      if (periodTimes[i]) {
        return i;
      }

    }

    return -1;
  }


  /*
    수업 사이 시간이거나
    아직 첫 수업 전이라면
    가장 가까운 미래 수업을 찾음
  */

  for (
    let i = 0;
    i < todaySchedule.length;
    i++
  ) {

    if (!periodTimes[i]) {
      continue;
    }

    const startMinutes =
      timeToMinutes(periodTimes[i][0]);


    if (
      startMinutes !== null &&
      currentMinutes < startMinutes
    ) {
      return i;
    }

  }


  return -1;

}


/* ==================================================
   ★ 남은 시간 표시
================================================== */

function formatRemaining(milliseconds) {

  if (milliseconds <= 0) {
    return "곧 시작합니다";
  }

  const totalSeconds =
    Math.floor(milliseconds / 1000);

  const hours =
    Math.floor(totalSeconds / 3600);

  const minutes =
    Math.floor((totalSeconds % 3600) / 60);

  const seconds =
    totalSeconds % 60;


  if (hours > 0) {

    return `${hours}시간 ${minutes}분 ${seconds}초 후`;

  }

  if (minutes > 0) {

    return `${minutes}분 ${seconds}초 후`;

  }

  return `${seconds}초 후`;

}


/* ==================================================
   ★ 다음 수업 표시
================================================== */

function updateNextClass() {

  const nextClass =
    document.getElementById("nextClass");

  const nextClassTime =
    document.getElementById("nextClassTime");


  /*
    오늘이 아니면
    실시간 다음 수업 표시 안 함
  */

  if (!isToday(selectedDate)) {

    nextClass.textContent =
      "오늘 날짜에서 확인할 수 있어요.";

    nextClassTime.textContent = "";

    return;

  }


  const todaySchedule =
    schedule[selectedDate.getDay()] || [];

  const nextIndex =
    getNextClassIndex();


  /*
    오늘 수업이 모두 끝난 경우
  */

  if (
    nextIndex === -1 ||
    !todaySchedule[nextIndex] ||
    !periodTimes[nextIndex]
  ) {

    nextClass.textContent =
      "오늘 수업이 끝났어요 🎉";

    nextClassTime.textContent = "";

    return;

  }


  const subject =
    todaySchedule[nextIndex];

  const [start, end] =
    periodTimes[nextIndex];


  const now = new Date();


  /*
    오늘 날짜 + 다음 수업 시작시간으로
    정확한 남은 시간을 계산
  */

  const startTime =
    new Date();

  const [hour, minute] =
    start.split(":").map(Number);

  startTime.setHours(
    hour,
    minute,
    0,
    0
  );


  const remaining =
    startTime.getTime() - now.getTime();


  nextClass.textContent =
    `${nextIndex + 1}교시 · ${subject}`;


  nextClassTime.innerHTML =
    `${start} ~ ${end}<br>
     <strong>${formatRemaining(remaining)}</strong>`;

}


/* ==================================================
   시간표 표시
================================================== */

function displaySchedule() {

  const day =
    selectedDate.getDay();

  const selectedSchedule =
    schedule[day] || [];

  const scheduleElement =
    document.getElementById("schedule");


  scheduleElement.innerHTML = "";


  if (selectedSchedule.length === 0) {

    scheduleElement.innerHTML = `
      <div class="none">
        이 날은 등록된 시간표가 없습니다. 😊
      </div>
    `;

    return;
  }


  const currentPeriod =
    getCurrentPeriod();


  selectedSchedule.forEach(
    (subject, index) => {

      const period =
        document.createElement("div");

      period.className = "period";


      /* 현재 교시 */
      if (index === currentPeriod) {

        period.classList.add("current");

      }


      /* 끝난 교시 */
      if (
        currentPeriod >= 0 &&
        index < currentPeriod
      ) {

        period.classList.add("finished");

      }


      const time =
        periodTimes[index]
          ? `${periodTimes[index][0]} ~ ${periodTimes[index][1]}`
          : "";


      period.innerHTML = `

        <div class="period-number">
          ${index + 1}
        </div>

        <div class="period-info">

          <div class="subject">

            <span
              class="subject-dot ${getSubjectDot(subject)}">
            </span>

            ${subject}

          </div>

          <div class="period-time">
            ${time}
          </div>

        </div>

        ${
          index === currentPeriod
            ? `
              <div class="current-label">
                ▶ 현재 수업
              </div>
            `
            : ""
        }

      `;


      scheduleElement.appendChild(period);

    }
  );

}


/* ==================================================
   준비물 표시
================================================== */

function displaySupplies() {

  const day =
    selectedDate.getDay();

  const selectedSchedule =
    schedule[day] || [];


  const suppliesElement =
    document.getElementById("supplies");


  suppliesElement.innerHTML = "";


  const uniqueSupplies = {};


  selectedSchedule.forEach(
    (subject, periodIndex) => {

      if (!supplies[subject]) {
        return;
      }


      supplies[subject].forEach(item => {

        if (!uniqueSupplies[item]) {
          uniqueSupplies[item] = [];
        }


        uniqueSupplies[item].push(
          `${periodIndex + 1}교시 ${subject}`
        );

      });

    }
  );


  if (
    Object.keys(uniqueSupplies).length === 0
  ) {

    suppliesElement.innerHTML = `
      <div class="none">
        등록된 준비물이 없습니다. 😊
      </div>
    `;

    return;

  }


  const dateKey =
    getDateKey(selectedDate);


  Object.entries(uniqueSupplies)
    .forEach(([item, subjects]) => {

      const div =
        document.createElement("div");

      div.className = "supply-item";


      const checkKey =
        `${dateKey}_${item}`;


      const isChecked =
        checkedSupplies[checkKey] === true;


      if (isChecked) {
        div.classList.add("checked");
      }


      div.innerHTML = `

        <label class="supply-check">

          <input
            type="checkbox"
            ${isChecked ? "checked" : ""}
          >

          <div>

            <div class="supply-name">
              🎒 ${item}
            </div>

            <div class="supply-subjects">
              ${subjects.join(", ")}
            </div>

          </div>

        </label>

      `;


      const checkbox =
        div.querySelector("input");


      checkbox.addEventListener(
        "change",
        () => {

          checkedSupplies[checkKey] =
            checkbox.checked;


          localStorage.setItem(
            "checkedSupplies",
            JSON.stringify(checkedSupplies)
          );


          div.classList.toggle(
            "checked",
            checkbox.checked
          );

        }
      );


      suppliesElement.appendChild(div);

    });

}


/* ==================================================
   주간 시간표
================================================== */

function displayWeeklySchedule() {

  const weeklyGrid =
    document.getElementById("weeklyGrid");


  weeklyGrid.innerHTML = "";


  const monday =
    new Date(selectedDate);

  const day =
    monday.getDay();


  const difference =
    day === 0 ? -6 : 1 - day;


  monday.setDate(
    monday.getDate() + difference
  );


  for (let i = 0; i < 5; i++) {

    const current =
      new Date(monday);


    current.setDate(
      monday.getDate() + i
    );


    const dayNumber =
      current.getDay();


    const subjects =
      schedule[dayNumber] || [];


    const dayBox =
      document.createElement("div");


    dayBox.className = "week-day";


    if (isToday(current)) {
      dayBox.classList.add("today");
    }


    dayBox.innerHTML = `

      <div class="week-day-title">

        ${dayNames[dayNumber]}

        <br>

        <small>
          ${current.getMonth() + 1}/${current.getDate()}
        </small>

      </div>

    `;


    subjects.forEach(
      (subject, index) => {

        const subjectBox =
          document.createElement("div");


        subjectBox.className =
          "week-subject";


        subjectBox.innerHTML = `
          ${index + 1}교시 · ${subject}
        `;


        dayBox.appendChild(subjectBox);

      }
    );


    if (subjects.length === 0) {

      dayBox.innerHTML += `
        <div class="none">
          수업 없음
        </div>
      `;

    }


    weeklyGrid.appendChild(dayBox);

  }

}

/* ==================================================
   시간표 저장
================================================== */

async function saveSchedule() {

  if(!isAdmin){alert('관리자 로그인 후 시간표를 저장할 수 있습니다.');return;}

  const day =
    selectedDate.getDay();


  const inputs =
    document.querySelectorAll(
      "#editorInputs input"
    );


  const newSchedule = [];


  inputs.forEach(input => {

    const value =
      input.value.trim();


    if (value) {
      newSchedule.push(value);
    }

  });


  schedule[day] =
    newSchedule;


  localStorage.setItem(
    "mySchedule",
    JSON.stringify(schedule)
  );

  const onlineSaved = await saveOnlineSchedule();
  if (!onlineSaved) return;


  document.getElementById("editor")
    .classList.remove("show");


  updatePage();


  alert("시간표가 저장되었습니다!");

}
